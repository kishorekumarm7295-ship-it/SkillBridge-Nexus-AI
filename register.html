<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
SkillBridge Register
</title>


<link rel="stylesheet" href="css/auth.css">


</head>


<body>



<div class="auth-container">


<div class="brand">


<h1>
🚀 Join SkillBridge
</h1>


<p>
Build your industry-ready career
</p>


</div>





<div class="auth-box">


<h2>
Create Account
</h2>


<form id="registerForm">


<label>
Full Name
</label>


<input 
type="text"
id="name"
placeholder="Enter your name"
required>



<label>
Email
</label>


<input 
type="email"
id="email"
placeholder="Enter email"
required>



<label>
Password
</label>


<input 
type="password"
id="password"
placeholder="Create password"
required>



<label>
Select Role
</label>


<select id="role">


<option>
Student
</option>


<option>
Industry
</option>


<option>
Faculty
</option>


<option>
Institution
</option>


</select>




<button type="submit">
Register
</button>



<p class="switch">

Already registered?

<a href="login.html">
Login
</a>

</p>


</form>


</div>


</div>



<script src="js/auth.js"></script>


</body>


</html>
