<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SkillBridge Login
</title>


<link rel="stylesheet" href="css/auth.css">

</head>


<body>


<div class="auth-container">


<div class="brand">


<h1>
🎓 SkillBridge Nexus
</h1>


<p>
AI Powered Academia-Industry Platform
</p>


</div>





<div class="auth-box">


<h2>
Welcome Back 👋
</h2>


<p>
Login to continue your journey
</p>



<form id="loginForm">


<label>
Email
</label>

<input 
type="email"
id="loginEmail"
placeholder="Enter email"
required>



<label>
Password
</label>


<input 
type="password"
id="loginPassword"
placeholder="Enter password"
required>




<label>
Login As
</label>


<select id="loginRole">


<option>
Student
</option>


<option>
Industry
</option>


<option>
Faculty
</option>


<option>
Institution
</option>


</select>




<button type="submit">
Login
</button>



<p class="switch">

Don't have an account?

<a href="register.html">
Create Account
</a>

</p>



</form>


</div>



</div>




<script src="js/auth.js"></script>


</body>

</html>
